group 'com.mapbox.maps.mapbox_maps'
version '1.0.0'

// 1. BLOK BUILDSCRIPT DIHAPUS SEPENUHNYA
// Kita biarkan Flutter (Built-in Kotlin) yang menyediakan plugin Kotlin secara otomatis.

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
        }
        maven {
            url 'https://api.mapbox.com/downloads/v2/snapshots/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = "mapbox"
                password = System.getenv("SDK_REGISTRY_TOKEN") ?: project.findProperty("SDK_REGISTRY_TOKEN") as String
            }
        }
    }
}

apply plugin: 'com.android.library'

// 2. "apply plugin: 'kotlin-android'" DIHAPUS SEPENUHNYA
// Flutter akan otomatis menyuntikkannya sehingga warning tidak akan muncul lagi.

android {
    compileSdk flutter.compileSdkVersion

    namespace 'com.mapbox.maps.mapbox_maps'
    
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    
    defaultConfig {
        minSdkVersion 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// 3. KONFIGURASI KOTLIN YANG DIREKOMENDASIKAN FLUTTER
// Ini adalah format paling aman untuk "Built-in Kotlin" agar file .kt tetap berhasil di-compile (bebas dari error 'cannot find symbol')
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

// Opsional: Bawaan mapbox untuk linting
if (file("$rootDir/gradle/ktlint.gradle").exists() && file("$rootDir/gradle/lint.gradle").exists()) {
    project.apply {
        from("$rootDir/gradle/ktlint.gradle")
        from("$rootDir/gradle/lint.gradle")
    }
}

dependencies {
    implementation "com.mapbox.maps:android-ndk27:11.28.0"

    implementation "androidx.annotation:annotation:1.5.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.6.2"
}